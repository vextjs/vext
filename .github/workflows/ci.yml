# ─────────────────────────────────────────────────────────────
# vextjs CI — Static gates → Tests → Package/docs contracts → Platform lane
#
# 触发条件：push main / pull_request → main
# Node.js 版本矩阵：20 / 22
#
# 流水线结构：
#   1. lint + format + typecheck（快速门禁，Node 20 / 22）
#   2. unit tests（无外部依赖，Node 20 / 22）
#   3. integration tests（无外部依赖，使用 mock，Node 20 / 22）
#   4. e2e tests（真实 HTTP 服务器，仅 Node 22）
#   5. coverage report（仅 Node 22，保存 GitHub Actions artifact）
#   6. package / docs contracts（Node 22）
#   7. Windows representative path and packaging lane（Node 22）
#
# @see plans/v1/10-testing.md §9（CI 集成指南）
# @see IMPLEMENTATION-PLAN.md 任务 4.5
# ─────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 取消同一 PR / branch 的旧运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── 全局环境变量 ──────────────────────────────────────────────

env:
  NODE_ENV: test

# ── Jobs ─────────────────────────────────────────────────────

jobs:
  # ────────────────────────────────────────────────────────────
  # 0. Version Channel Check（候选与公开稳定版分层门禁）
  # ────────────────────────────────────────────────────────────
  version-check:
    name: Version Channel Check
    runs-on: ubuntu-latest
    # 普通 CI 允许 next 候选与 npm stable 并存；tag release 另行 exact 校验。

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run version channel check
        run: bash scripts/check-version-sync.sh

      - name: Verify CI workflow contract
        run: npm run verify:ci-contract

  # ────────────────────────────────────────────────────────────
  # 1. Lint + Format + Typecheck（快速门禁）
  # ────────────────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The changed-file formatter compares the complete PR/push delta.
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check
        env:
          FORMAT_CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: TypeScript type check
        run: npm run typecheck

      - name: Build (verify compilation)
        run: npm run build

  # ────────────────────────────────────────────────────────────
  # 2. Unit Tests（无外部依赖）
  # ────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint-typecheck

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # deferred-header-flush and package-layout unit fixtures import dist/ via file URL
      - name: Build (required for dist-linked unit fixtures)
        run: npm run build

      - name: Run unit tests
        run: npx vitest run test/unit --reporter=verbose

  # ────────────────────────────────────────────────────────────
  # 3. Integration Tests（使用 mock，无外部服务依赖）
  # ────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint-typecheck

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (required for cluster integration tests)
        run: npm run build

      - name: Run integration tests
        run: npx vitest run test/integration --reporter=verbose

  # ────────────────────────────────────────────────────────────
  # 4. E2E Tests（真实 HTTP 服务器，仅 Node 22）
  # ────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Node 22)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (required for CLI E2E tests)
        run: npm run build

      - name: Run E2E tests
        run: npx vitest run test/e2e --reporter=verbose
        timeout-minutes: 10

  # ────────────────────────────────────────────────────────────
  # 5. Coverage Report（仅 Node 22，上传 Codecov）
  # ────────────────────────────────────────────────────────────
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (required for dist-linked coverage fixtures)
        run: npm run build

      - name: Run tests with coverage
        run: npx vitest run --coverage --coverage.provider=v8 --coverage.reporter=lcov --coverage.reporter=text

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  # ────────────────────────────────────────────────────────────
  # 6. 文档站构建验证（PR 门禁）
  # ────────────────────────────────────────────────────────────
  docs-build:
    name: Build Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install package dependencies
        run: npm ci

      - name: Build package for executable CLI contract
        run: npm run build

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Audit website production dependencies
        working-directory: website
        run: npm audit --omit=dev --audit-level=high

      - name: Verify documentation source contract
        run: node scripts/validation/verify-documentation-contract.mjs

      - name: Build docs (rspress build)
        working-directory: website
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify rendered documentation contract
        run: node scripts/validation/verify-documentation-contract.mjs --rendered

  # ────────────────────────────────────────────────────────────
  # 7. Package contract checks（Node 22）
  # ────────────────────────────────────────────────────────────
  package-contracts:
    name: Package Contracts (Node 22)
    runs-on: ubuntu-latest
    needs: lint-typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify public exports and package composition
        run: npm run verify:exports && npm run verify:package-composition

      - name: Verify adapter startup contract
        run: npm run verify:adapters

  # ────────────────────────────────────────────────────────────
  # 8. Windows representative lane（Node 22）
  # ────────────────────────────────────────────────────────────
  windows-node22:
    name: Windows Paths & Package (Node 22)
    runs-on: windows-latest
    needs: lint-typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build package through Windows npm shim
        run: npm run build

      - name: Run Windows path and deployment regression set
        run: >-
          npx vitest run
          test/unit/path-boundary.test.ts
          test/unit/cli/build-command.test.ts
          test/unit/frontend-deploy-validation.test.ts
          test/unit/frontend-runtime.test.ts
          --reporter=verbose

      - name: Verify Windows package exports
        run: npm run verify:exports

  # ────────────────────────────────────────────────────────────
  # 9. CI 总结（所有检查通过后的统一 status check）
  # ────────────────────────────────────────────────────────────
  ci-ok:
    name: CI ✅
    runs-on: ubuntu-latest
    needs:
      [
        version-check,
        lint-typecheck,
        unit-tests,
        integration-tests,
        e2e-tests,
        coverage,
        docs-build,
        package-contracts,
        windows-node22,
      ]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          echo "version-check: ${{ needs.version-check.result }}"
          echo "lint-typecheck: ${{ needs.lint-typecheck.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "integration-tests: ${{ needs.integration-tests.result }}"
          echo "e2e-tests: ${{ needs.e2e-tests.result }}"
          echo "coverage: ${{ needs.coverage.result }}"
          echo "docs-build: ${{ needs.docs-build.result }}"
          echo "package-contracts: ${{ needs.package-contracts.result }}"
          echo "windows-node22: ${{ needs.windows-node22.result }}"

          # version-check 可能被跳过（package.json 未变更），跳过视为通过
          if [[ "${{ needs.version-check.result }}" != "success" && "${{ needs.version-check.result }}" != "skipped" ]]; then
            echo "❌ version-check failed"
            exit 1
          fi

          if [[ "${{ needs.lint-typecheck.result }}" != "success" ]]; then
            echo "❌ lint-typecheck failed"
            exit 1
          fi

          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "❌ unit-tests failed"
            exit 1
          fi

          if [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
            echo "❌ integration-tests failed"
            exit 1
          fi

          if [[ "${{ needs.e2e-tests.result }}" != "success" ]]; then
            echo "❌ e2e-tests failed"
            exit 1
          fi

          if [[ "${{ needs.coverage.result }}" != "success" ]]; then
            echo "❌ coverage failed"
            exit 1
          fi

          if [[ "${{ needs.docs-build.result }}" != "success" ]]; then
            echo "❌ docs-build failed"
            exit 1
          fi

          if [[ "${{ needs.package-contracts.result }}" != "success" ]]; then
            echo "❌ package-contracts failed"
            exit 1
          fi

          if [[ "${{ needs.windows-node22.result }}" != "success" ]]; then
            echo "❌ windows-node22 failed"
            exit 1
          fi

          echo "✅ All CI checks passed!"
